{% extends 'base.html' %}
{% block title %}{{ note.topic }} — PrepMate{% endblock %}

{% block content %}
<div class="pm-app-container">
  <div class="pm-reading">
    <a href="{% url 'materials' %}" class="pm-back"><i class="bi bi-chevron-left" aria-hidden="true"></i> Study material</a>

    <h1 class="pm-note-title">{{ note.topic }}</h1>

    <article class="pm-card pm-note">
      {{ note.content|linebreaks }}
    </article>

    <div class="pm-actions">
      <form method="post" action="{% url 'practice_topic' %}" data-ai-loading="test">
        {% csrf_token %}
        <input type="hidden" name="topic" value="{{ note.topic }}">
        <button type="submit" class="pm-btn pm-btn-primary">Practice this topic</button>
      </form>
      <a href="{% url 'materials' %}" class="pm-btn pm-btn-outline">Back</a>
    </div>
  </div>
</div>
{% endblock %}
